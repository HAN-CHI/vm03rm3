<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>苗栗縣第21屆議員選舉（第3選區：通霄鎮、苑裡鎮）即時看板</title>
<style>
  :root {
    --bg-dark: #0f172a;
    --card-bg: #1e293b;
    --card-border: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent-gold: #fbbf24;
    --accent-blue: #38bdf8;
    --dpp-green: #16a34a;
    --indep-slate: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    padding: 20px;
    min-height: 100vh;
  }
  header {
    text-align: center;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--card-border);
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 2.2rem;
    color: var(--accent-gold);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .meta-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    font-size: 1.05rem;
    color: var(--text-muted);
  }
  .meta-bar span strong { color: #fff; }
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(22, 163, 74, 0.2);
    color: #4ade80;
    padding: 3px 12px;
    border-radius: 999px;
    font-weight: bold;
    border: 1px solid #22c55e;
  }
  .live-badge.error {
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
    border-color: #ef4444;
  }
  .dot {
    width: 10px;
    height: 10px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  .live-badge.error .dot { background: #ef4444; }
  @keyframes pulse {
    0% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.2); }
    100% { opacity: 1; transform: scale(1); }
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 18px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
    transition: transform 0.2s ease;
  }
  .card.top-rank {
    border: 2px solid var(--accent-gold);
    box-shadow: 0 0 20px rgba(251, 191, 36, 0.25);
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cand-id-name {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .no-badge {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent-gold);
    color: #0f172a;
    font-size: 1.5rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cand-name {
    font-size: 1.85rem;
    font-weight: 800;
  }
  .party-tag {
    padding: 4px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: bold;
    background: var(--indep-slate);
  }
  .party-dpp { background: var(--dpp-green); }
  .votes-box {
    background: rgba(15, 23, 42, 0.65);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    margin-bottom: 12px;
  }
  .votes-num {
    font-size: 3.1rem;
    font-weight: 900;
    color: var(--accent-blue);
    line-height: 1.1;
  }
  .votes-sub {
    display: flex;
    justify-content: space-around;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed #334155;
    font-size: 0.95rem;
    color: var(--text-muted);
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
    color: #cbd5e1;
  }
  .rate-pill {
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent-blue);
    padding: 2px 10px;
    border-radius: 6px;
    font-weight: bold;
  }
  footer {
    text-align: center;
    margin-top: 28px;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <h1>苗栗縣議會第21屆議員選舉 — 第3選區（通霄鎮、苑裡鎮）</h1>
  <div class="meta-bar">
    <span class="live-badge" id="connBadge"><span class="dot"></span><span id="connText">雲端即時同步中（每 5 秒更新）</span></span>
    <span>選區選舉人數：<strong>63,384</strong> 人（通霄 26,660 / 苑裡 36,724）</span>
    <span>總有效票累計：<strong id="totalVotes">0</strong> 票</span>
    <span>最後更新：<strong id="lastUpdate">--:--:--</strong></span>
  </div>
</header>

<main class="grid" id="board"></main>

<footer>
  說明：本看板直接連線翁杰服務處 Google 試算表「即時看板總表」，支援多服務處電視牆與手機同步檢視。
</footer>
<footer>
  規劃：彭勇智 | 設計：劉翰錡
</footer>

<script>
  // 已更新為您指定的 Google 試算表 ID
  const SHEET_ID = '1W1kSyw6XhQJ_VsaM1q5TZxMrwIj8J1rw';
  const SHEET_NAME = '即時看板總表';
  const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const REFRESH_SECONDS = 5;

  const DEFAULT_DATA = [
    { no: '1', name: '翁杰', party: '民主進步黨', votes: 0, rate: '0.00%', note: '開票統計中', tongxiao: 0, yuanli: 0 },
    { no: '2', name: '王建鑫', party: '無', votes: 0, rate: '0.00%', note: '開票統計中', tongxiao: 0, yuanli: 0 },
    { no: '3', name: '徐瑞轅', party: '無', votes: 0, rate: '0.00%', note: '開票統計中', tongxiao: 0, yuanli: 0 },
    { no: '4', name: '郭汶沂', party: '無', votes: 0, rate: '0.00%', note: '開票統計中', tongxiao: 0, yuanli: 0 },
    { no: '5', name: '杜文卿', party: '民主進步黨', votes: 0, rate: '0.00%', note: '開票統計中', tongxiao: 0, yuanli: 0 },
    { no: '6', name: '陳薈茗', party: '無', votes: 0, rate: '0.00%', note: '開票統計中', tongxiao: 0, yuanli: 0 },
    { no: '7', name: '周玉滿', party: '無', votes: 0, rate: '0.00%', note: '開票統計中', tongxiao: 0, yuanli: 0 }
  ];

  function parseCSVRow(rowStr) {
    const result = [];
    let cur = '';
    let inQuotes = false;
    for (let i = 0; i < rowStr.length; i++) {
      const ch = rowStr[i];
      if (ch === '"') {
        if (inQuotes && rowStr[i + 1] === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === ',' && !inQuotes) {
        result.push(cur.trim());
        cur = '';
      } else {
        cur += ch;
      }
    }
    result.push(cur.trim());
    return result;
  }

  function renderCards(list) {
    const board = document.getElementById('board');
    board.innerHTML = '';

    let total = 0;
    list.forEach(item => {
      const v = parseInt(String(item.votes).replace(/,/g, ''), 10) || 0;
      total += v;
    });
    document.getElementById('totalVotes').innerText = total.toLocaleString();

    const maxVotes = Math.max(...list.map(i => parseInt(String(i.votes).replace(/,/g, ''), 10) || 0));

    list.forEach(item => {
      const v = parseInt(String(item.votes).replace(/,/g, ''), 10) || 0;
      const tx = parseInt(String(item.tongxiao || '0').replace(/,/g, ''), 10) || 0;
      const yl = parseInt(String(item.yuanli || '0').replace(/,/g, ''), 10) || 0;
      const isTop = (maxVotes > 0 && v === maxVotes);
      const partyClass = (item.party || '').includes('民主進步黨') ? 'party-tag party-dpp' : 'party-tag';

      board.innerHTML += `
        <div class="card ${isTop ? 'top-rank' : ''}">
          <div class="card-header">
            <div class="cand-id-name">
              <div class="no-badge">${item.no}</div>
              <div class="cand-name">${item.name}</div>
            </div>
            <div class="${partyClass}">${item.party}</div>
          </div>
          <div class="votes-box">
            <div class="votes-num">${v.toLocaleString()}</div>
            <div class="votes-sub">
              <span>通霄鎮：<strong>${tx.toLocaleString()}</strong></span>
              <span>苑裡鎮：<strong>${yl.toLocaleString()}</strong></span>
            </div>
          </div>
          <div class="status-bar">
            <span>狀態：${item.note || '服務處同步中'}</span>
            <span class="rate-pill">得票率 ${item.rate || '0.00%'}</span>
          </div>
        </div>
      `;
    });

    const now = new Date();
    document.getElementById('lastUpdate').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
  }

  async function fetchData() {
    const badge = document.getElementById('connBadge');
    const connText = document.getElementById('connText');
    try {
      const response = await fetch(`${CSV_URL}&t=${new Date().getTime()}`);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      const text = await response.text();
      const lines = text.trim().split(/\r?\n/);

      const parsed = [];
      for (let i = 1; i <= 7 && i < lines.length; i++) {
        const cols = parseCSVRow(lines[i]);
        const [no, name, party, votes, rate, note, tongxiao, yuanli] = cols;
        if (!name || no === '合計') continue;
        parsed.push({ no, name, party, votes, rate, note, tongxiao, yuanli });
      }

      if (parsed.length > 0) {
        renderCards(parsed);
        badge.classList.remove('error');
        connText.innerText = '雲端即時同步中（每 5 秒更新）';
      } else {
        throw new Error('無有效資料列');
      }
    } catch (err) {
      console.error('讀取雲端試算表失敗:', err);
      badge.classList.add('error');
      connText.innerText = '連線中斷（請確認試算表已設為「知道連結者皆可檢視」）';
      renderCards(DEFAULT_DATA);
    }
  }

  fetchData();
  setInterval(fetchData, REFRESH_SECONDS * 1000);
</script>

</body>
</html>
